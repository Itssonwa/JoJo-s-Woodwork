<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - JoJo’s Woodwork</title>
  <link rel="stylesheet" href="CSS/style.css">
  <meta name="description" content="JoJo's Woodwork creates quality handcrafted furniture in Durban.">
  <meta name="keywords" content="woodwork, furniture, Durban, tables, chairs, custom furniture">
  <meta name="author" content="JoJo's Woodwork">
</head>

<body>
  <div class="container">
    <header class="top-nav">
      <a href="index.html" class="btn home">Home</a>
    </header>

    <section class="contact-info">
      <h2>How to reach use </h2>
      <p> Phone: +27 12 345 678 </p>
      <p> Email: info@jojoswoodwork.co.za</p>
      <p> Hours: Mon–Sat, 7:00 AM – 6:00 PM</p>
    </section>

    <section class="address">
      <h2>Address</h2>
      <p>123 Roundhouse Lane, Durban, KwaZulu‑Natal, South Africa</p>
    </section>
    <section class="contact-form">
    <h2>Send Us a Message</h2>

    <form id="contactForm">

        <label for="name">Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="messageType">Message Type:</label><br>
        <select id="messageType" required>
            <option value="">Select</option>
            <option>General Enquiry</option>
            <option>Quote Request</option>
            <option>Complaint</option>
        </select><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" required></textarea><br><br>

        <button type="submit" class="send">Send Message</button>

    </form>
</section>
  </div>
</body>
</html>
